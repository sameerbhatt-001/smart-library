<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART LIBRARY - DASHBOARD</title>
</head>
<body>
 <!-- Top Navigation Bar -->
<div style="background-color: #007bff; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;">
    <h2 style="margin: 0;">Smart Library Dashboard</h2>
    <div style="display: flex; align-items: center; gap: 15px;">
        <span>Welcome, Student!</span>
        <a href="logn.html" style="background-color: #dc3545; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-size: 14px; font-weight: bold;">Logout 🚪</a>
    </div>
</div>

    <!-- Main Container -->
    <div style="display: flex; min-height: calc(100vh - 60px);">
        
        <!-- Sidebar Menu Options -->
        <div style="width: 200px; background-color: #1e293b; color: white; padding: 20px;">
            <p style="cursor:pointer; padding: 10px 0;">📌 Dashboard</p>
            <p style="cursor:pointer; padding: 10px 0;"><a href="search.html" style="color: white; text-decoration: none;">📚 Search Books</a></p>
            <p style="cursor:pointer; padding: 10px 0;"><a href="issued.html" style="color: white; text-decoration: none;">📖 Issued Books</a></p>
            <p style="cursor:pointer; padding: 10px 0;"><a href="notes.html" style="color: white; text-decoration: none;">📁 Digital Notes</a></p>
            <p style="cursor:pointer; padding: 10px 0;"><a href="profile.html" style="color: white; text-decoration: none;">👤 Profile</a></p>
        </div>

        <!-- Main Content Area -->
        <div style="flex: 1; padding: 20px; background-color: #f4f6f9;">
            <h3>Overview</h3>
            
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                    <h4>Total Books</h4>
                    <p>--</p>
                </div>
                <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                    <h4>Issued Books</h4>
                    <p>--</p>
                </div>
                <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                    <h4>Fine Due</h4>
                    <p>₹0</p>
                </div>
            </div>
        </div>

    </div>   
</body>
</html>
