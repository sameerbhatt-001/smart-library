<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Smart Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }
        /* Top Image Styling */
        .card-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .login-card h2 {
            margin-bottom: 6px;
            font-size: 24px;
            color: #38bdf8;
        }
        .login-card p.subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #cbd5e1;
        }
        .input-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #0369a1;
        }
        .switch-link {
            margin-top: 18px;
            font-size: 13px;
            color: #94a3b8;
        }
        .switch-link a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }
        .switch-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Photo -->
        <img src="library.jpg" alt="Library" class="card-img">

        <h2>Admin Portal 🔑</h2>
        <p class="subtitle">Smart Library Management</p>

        <form id="adminForm">
            <div class="input-group">
                <label for="adminId">Admin ID / Username</label>
                <input type="text" id="adminId" placeholder="Enter Admin ID" required>
            </div>

            <div class="input-group">
                <label for="adminPass">Security Password</label>
                <input type="password" id="adminPass" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="btn-submit">Login as Admin</button>
        </form>

        <!-- Student Login Link -->
        <div class="switch-link">
            Not an Admin? <a href="logn.html">Go to Student Login</a>
        </div>
    </div>

    <script>
        document.getElementById('adminForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('adminId').value;
            const pass = document.getElementById('adminPass').value;

            // Basic Demo Credentials
            if(id === "admin" && pass === "1234") {
                alert("Welcome Admin!");
            } else {
                alert("Invalid Admin Credentials!");
            }
        });
    </script>
</body>
</html>
